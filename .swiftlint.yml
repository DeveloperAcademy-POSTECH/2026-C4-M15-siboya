disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - statement_position
  - unused_setter_value
  - notification_center_detachment
  - large_tuple
  - cyclomatic_complexity
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional

included:
  - .

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - "*.xcodeproj"

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 1000

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 50

force_cast:
  severity: warning

reporter: "xcode"
