included:
  - Siboya
  - SiboyaTests
  - SiboyaUITests

excluded:
  - .build
  - DerivedData

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - empty_count
  - empty_string
  - first_where
  - last_where
  - modifier_order
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

identifier_name:
  excluded:
    - id
    - x
    - y

reporter: xcode
