name: SwiftLint

on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - "Brewfile"
      - "Scripts/lint.sh"
      - ".github/workflows/swiftlint.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - "Brewfile"
      - "Scripts/lint.sh"
      - ".github/workflows/swiftlint.yml"

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew bundle

      - name: Run SwiftLint
        run: ./Scripts/lint.sh --strict --reporter github-actions-logging
