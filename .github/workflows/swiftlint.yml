name: SwiftLint

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - "Brewfile"
      - "Scripts/lint.sh"
      - ".github/workflows/swiftlint.yml"

  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - "Brewfile"
      - "Scripts/lint.sh"
      - ".github/workflows/swiftlint.yml"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew bundle

      - name: Install reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Run SwiftLint with reviewdog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./Scripts/lint.sh --reporter checkstyle \
            | reviewdog \
                -f=checkstyle \
                -name="SwiftLint" \
                -reporter=github-pr-review \
                -fail-level=error

      - name: Run SwiftLint with GitHub Actions logging
        if: github.event_name != 'pull_request'
        run: ./Scripts/lint.sh --reporter github-actions-logging
